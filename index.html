<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rathan Raju · Senior Analytics Engineer</title>
<meta name="description" content="Portfolio of Rathan Raju, Senior Analytics Engineer working on project controls data for UK rail infrastructure.">
<meta name="theme-color" content="#f8fafc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,700&display=swap">
<style>
/* ============================================================
   Portfolio, self-contained stylesheet
   ============================================================ */
:root{
  --navy:#0b1f4d; --blue:#2563eb; --blue-600:#1d4ed8; --blue-300:#60a5fa;
  --teal:#14b8a6; --violet:#8b5cf6; --orange:#f97316; --amber:#f5b400; --green:#22c55e;
  --page:#f8fafc; --card:#ffffff; --card-2:#f5f7fb; --sky:#eaf1fe;
  --head:#0b1f4d; --ink:#1e293b; --ink-soft:#475569; --ink-mute:#7f8daa;
  --line:#e6eaf2; --track:#e9eef6; --btn:#0b1f4d;
  --shadow:0 1px 2px rgba(15,27,51,.04), 0 12px 30px -20px rgba(15,27,51,.28);
  --shadow-lg:0 24px 50px -26px rgba(15,27,51,.38);
  /* illustration palette */
  --i-blob:#e9f1fe; --i-paper:#ffffff; --i-line:#e3e8f1; --i-panel:#f3f6fb; --i-grid:#e2e8f1;
  --i-desk:#e3e8f0; --i-desk-2:#cbd3df; --i-frame:#0b1f4d; --i-navy:#0b1f4d;
  --i-skin:#f6b9a1; --i-skin-2:#e9a38a; --i-hair:#1a1f33; --i-shirt:#1e6fbf;
  --i-jacket:#13306e; --i-pants:#0b1f4d; --i-pants-2:#1a2f63; --i-shoe:#070f2a;
  --i-chair:#334e86; --i-chair-2:#24396a; --i-shadow:rgba(11,31,77,.10); --i-cloud:#dbe8fd;
  --r-lg:20px; --r-md:14px;
  --font:'Google Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --wrap:1180px;
}
html[data-theme="dark"]{
  --page:#070d1f; --card:#0e1730; --card-2:#121d3a; --sky:#14224a;
  --head:#eef3fc; --ink:#e2e8f5; --ink-soft:#b3bfd8; --ink-mute:#8794b3;
  --line:#1e2b4d; --track:#1b2745; --btn:#2563eb;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.7);
  --shadow-lg:0 24px 50px -22px rgba(0,0,0,.85);
  --i-blob:#111d3d; --i-paper:#f1f5fb; --i-line:#2a3a63; --i-panel:#e6ecf6; --i-grid:#cfd8e6;
  --i-desk:#2a3a63; --i-desk-2:#22305a; --i-frame:#3a5291; --i-navy:#9fb4dc;
  --i-pants:#2b4278; --i-pants-2:#22376a; --i-jacket:#2b4a8f; --i-shoe:#0b142f;
  --i-chair:#3c5794; --i-chair-2:#2c4378; --i-shadow:rgba(0,0,0,.35); --i-cloud:#1a2c5c;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{
  background:var(--page); color:var(--ink); font-family:var(--font);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s; overflow-x:hidden;
}
h1,h2,h3,h4,p,ul{margin:0;padding:0}
ul{list-style:none}
a{color:inherit}
::selection{background:rgba(37,99,235,.22)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* ---------- Constellation background ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.nav,main,.foot{position:relative;z-index:1}

/* ---------- Navigation ---------- */
.nav{
  position:sticky;top:0;z-index:90;
  background:color-mix(in srgb,var(--page) 84%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s;
}
.nav.scrolled{border-bottom-color:var(--line);box-shadow:0 10px 26px -22px rgba(15,27,51,.45)}
.nav-in{max-width:var(--wrap);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;position:relative}
.logo{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--head);
  font-size:20px;font-weight:700;letter-spacing:-.01em;margin-right:auto;white-space:nowrap;
}
.logo-mark{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--teal));box-shadow:0 10px 20px -12px var(--blue);
  transition:transform .3s cubic-bezier(.2,.8,.3,1.4);
}
.logo-mark svg{width:20px;height:20px}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.05)}
.logo-dot{color:var(--blue)}
.menu{display:flex;gap:2px}
.menu a{
  text-decoration:none;color:var(--ink-soft);font-size:15px;font-weight:500;
  padding:8px 13px;border-radius:999px;transition:.18s;white-space:nowrap;
}
.menu a:hover{color:var(--head);background:var(--sky)}
.menu a.active{color:var(--blue);background:var(--sky)}
.nav-act{display:flex;gap:6px}
.ib{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;transition:.18s;
}
.ib:hover{color:var(--blue);border-color:var(--blue);transform:translateY(-1px)}
.ib svg{width:17px;height:17px}
.burger{display:none}

/* ---------- Sections ---------- */
.sec{max-width:var(--wrap);margin:0 auto;padding:84px 20px;scroll-margin-top:64px}
.sec-head{text-align:center;max-width:720px;margin:0 auto 44px}
.h2,.sec-head h2{font-size:clamp(34px,4.6vw,52px);line-height:1.1;font-weight:700;color:var(--head);letter-spacing:-.015em}
.sec-head p{margin-top:14px;font-size:18px;color:var(--ink-mute)}
.lead-s{font-size:17px;line-height:1.7;color:var(--ink-mute);margin-top:16px}

/* ---------- Hero ---------- */
#home{padding-top:36px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;min-height:min(620px,calc(100vh - 150px))}
.hero h1{font-size:clamp(40px,6.2vw,70px);line-height:1.04;font-weight:700;color:var(--head);letter-spacing:-.025em}
.nick{font-style:italic;font-weight:700;font-size:20px;color:var(--head);margin:16px 0 18px}
.lead{font-size:clamp(18px,2.1vw,23px);line-height:1.5;color:var(--ink-mute);max-width:36ch}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{
  display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);font-weight:500;
}
.chip svg{width:15px;height:15px;color:var(--blue)}
.live{width:8px;height:8px;border-radius:50%;background:var(--green);animation:live 2.2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.soc{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:var(--b);text-decoration:none;transition:transform .2s,box-shadow .2s;
  box-shadow:0 8px 16px -10px var(--b);
}
.soc:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 12px 22px -10px var(--b)}
html[data-theme="dark"] .soc{box-shadow:0 0 0 1px rgba(255,255,255,.14),0 8px 16px -10px var(--b)}
.soc svg{width:19px;height:19px}
.hero-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:13px 18px;border-radius:10px;
  font:600 15px/1 var(--font);letter-spacing:.02em;text-decoration:none;cursor:pointer;
  border:1.5px solid transparent;transition:.2s;white-space:nowrap;
}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--btn);color:#fff;box-shadow:0 12px 24px -14px var(--btn)}
.btn-primary:hover{transform:translateY(-2px);background:var(--blue);box-shadow:0 14px 26px -12px var(--blue)}
.btn-primary .star{color:#fbbf24}
.btn-gold{border-color:#c9a23c;color:#8f6f1f;background:transparent}
html[data-theme="dark"] .btn-gold{color:#e0bd5b}
.btn-gold:hover{background:#b8912f;border-color:#b8912f;color:#fff;transform:translateY(-2px)}
.btn-ghost{border-color:var(--line);color:var(--ink-soft);background:var(--card)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px)}
.hero-art .ill{width:100%;height:auto;display:block}

/* ---------- Cards & stats ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:22px;position:relative;
  transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s,border-color .25s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--blue) 30%,var(--line))}
.card-h{
  display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--head);margin-bottom:18px;min-height:24px;
}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:40px}
.stat{display:flex;align-items:center;gap:14px;padding:16px}
.stat .ic{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;
  color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);
}
.stat .ic svg{width:23px;height:23px}
.stat .v{font-size:30px;font-weight:700;line-height:1;color:var(--head);letter-spacing:-.02em}
.stat .l{font-size:12.5px;color:var(--ink-mute);margin-top:6px;line-height:1.3}

/* ---------- Focus lenses ---------- */
.lensbar{
  display:flex;align-items:center;justify-content:center;gap:10px 12px;flex-wrap:wrap;
  margin-top:18px;padding:11px 16px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
}
.lensbar-l{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);flex:none}
.lensbar-l svg{width:15px;height:15px;color:var(--blue)}
.lens-chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.lens{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;
  font:500 13px/1 var(--font);padding:8px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink-soft);transition:.18s;
}
.lens-dot{width:8px;height:8px;border-radius:50%;background:var(--lc);flex:none;transition:.18s}
.lens:hover{color:var(--head);border-color:var(--lc);transform:translateY(-1px)}
.lens[aria-pressed="true"]{
  background:color-mix(in srgb,var(--lc) 14%,transparent);border-color:var(--lc);color:var(--head);
  box-shadow:0 4px 14px -6px var(--lc);
}
.lens[aria-pressed="true"] .lens-dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 28%,transparent)}
.lens-clear{
  font:600 12px/1 var(--font);cursor:pointer;background:none;border:none;flex:none;
  color:var(--ink-mute);text-decoration:underline;text-underline-offset:3px;
  padding:4px 2px;display:none;
}
body.lens-on .lens-clear{display:inline-block}
.lens-clear:hover{color:var(--blue)}
body.lens-on [data-lens]{transition:opacity .28s ease,filter .28s ease}
body.lens-on [data-lens].lens-miss{opacity:.2;filter:saturate(.25)}
body.lens-on .bolts li.lens-hit,body.lens-on .exp.lens-hit{
  background:color-mix(in srgb,var(--blue) 7%,transparent);border-radius:12px;
}
body.lens-on .xp.lens-hit .xp-card{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent),var(--shadow)}
body.lens-on circle[data-lens].lens-miss{opacity:.3}

/* ---------- What I Do ---------- */
.exp-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:26px}
.exp{text-align:center;padding:8px 6px;border-radius:var(--r-md);transition:background .2s}
.exp:hover{background:color-mix(in srgb,var(--blue) 6%,transparent)}
.exp .ic{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:#fff;
  box-shadow:0 10px 20px -12px currentColor;transition:transform .3s cubic-bezier(.2,.8,.3,1.4);
}
.exp:hover .ic{transform:translateY(-4px) rotate(-4deg)}
.exp .ic svg{width:27px;height:27px}
.exp b{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--head);line-height:1.35}
.exp p{font-size:13px;color:var(--ink-mute);margin-top:7px;line-height:1.5}
.wid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:34px 0}
.wid.flip .wid-art{order:2}
.wid-art .ill{width:100%;height:auto;display:block}
.wid h3{font-size:clamp(28px,3.4vw,42px);font-weight:500;color:var(--head);line-height:1.15;letter-spacing:-.01em}
.tech-strip{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 24px}
.tech{display:flex;flex-direction:column;align-items:center;gap:7px;width:78px;text-align:center}
.tech-ic{
  width:58px;height:58px;border-radius:16px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .3s cubic-bezier(.2,.8,.3,1.4);
}
html[data-theme="dark"] .tech-ic{background:#f4f7fc;border-color:#f4f7fc}
.tech:hover .tech-ic{transform:translateY(-4px) rotate(-4deg)}
.tech-ic > svg{width:30px;height:30px}
.gen{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--g)}
.gen svg{width:19px;height:19px}
.tech-l{font-size:12px;color:var(--ink-mute);line-height:1.25;font-weight:500}
.bolts{display:grid;gap:10px}
.bolts li{display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--ink-soft);line-height:1.55;padding:2px 4px}
.bolts .bolt{width:18px;height:18px;color:var(--amber);flex:none;margin-top:3px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;margin-top:34px}

/* bars */
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:center;gap:12px}
.bar-name{font-size:13.5px;font-weight:500;color:var(--ink-soft)}
.bar{position:relative;height:9px;border-radius:99px;background:var(--track);overflow:visible}
.bar-fill{
  position:absolute;inset:0 auto 0 0;border-radius:99px;width:0;
  background:linear-gradient(90deg,var(--blue-300),var(--blue));transition:width 1s cubic-bezier(.2,.8,.2,1);
}
.bar-val{position:absolute;right:0;top:-20px;font-size:11.5px;font-weight:700;color:var(--blue);opacity:0;transition:opacity .2s}
.bar-row:hover .bar-val,.ind-row:hover .bar-val{opacity:1}
.bar-row:hover .bar-name,.ind-row:hover .nm{color:var(--head)}
.bar-row:hover .bar-fill,.ind-row:hover .bar-fill{filter:saturate(1.25) brightness(1.06)}

/* donut */
.donut-wrap{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:1}
.donut{position:absolute;left:27.5%;top:27.5%;width:45%;height:45%;transform:rotate(-90deg);overflow:visible}
.donut circle{transition:stroke-width .22s ease,opacity .22s ease;cursor:pointer}
.donut circle.dim{opacity:.32}
.donut circle:focus-visible{outline:none;stroke-width:26}
.donut-mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-mid .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 auto;
  background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.donut-mid .ic svg{width:24px;height:24px}
.donut-mid .pv{font-size:22px;font-weight:700;line-height:1.1}
.donut-mid .pl{font-size:11px;color:var(--ink-mute);max-width:12ch;margin:3px auto 0;line-height:1.3}
.dlab{position:absolute;width:80px;font-size:11px;line-height:1.35;color:var(--ink-mute);transform:translate(-50%,-50%);cursor:pointer;transition:opacity .2s,transform .2s}
.dlab b{display:block;font-size:15px;font-weight:700;color:var(--head);margin-bottom:2px}
.dlab.dim{opacity:.34}
.dlab.on{transform:translate(-50%,-50%) scale(1.08)}

/* ---------- Experience ---------- */
.sec-intro{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center;margin-bottom:40px}
.sec-intro .ill{width:100%;height:auto;display:block}
.xp-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.xp-side{display:grid;gap:18px;position:sticky;top:84px}
.xp-list{position:relative}
.xp-list::before{content:"";position:absolute;left:27px;top:28px;bottom:28px;width:3px;border-radius:3px;background:var(--rail)}
.xp{display:grid;grid-template-columns:56px minmax(0,1fr);gap:18px;margin-bottom:18px;position:relative}
.xp:last-child{margin-bottom:0}
.xp-logo{
  width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;
  font-weight:700;font-size:17px;letter-spacing:.02em;position:relative;z-index:1;
  box-shadow:0 0 0 6px var(--page),0 12px 22px -12px var(--c);
}
.xp-card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px 14px;
  box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,border-color .25s;
}
.xp-card:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line));transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.xp-top{display:flex;justify-content:space-between;gap:10px 14px;align-items:flex-start;flex-wrap:wrap}
.xp h4{font-size:19px;font-weight:700;color:var(--head);line-height:1.25}
.xp-co{font-weight:600;color:var(--c);font-size:15px;margin-top:2px}
.xp-yr{
  font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 12%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--head));
}
.xp-ul{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.xp-ul li{font-size:13px;padding:6px 11px;border-radius:9px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-soft)}
.xp-more{
  margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:none;border:none;
  padding:4px 0;color:var(--blue);font:600 14px var(--font);cursor:pointer;
}
.xp-more svg{width:16px;height:16px;transition:transform .25s}
.xp-more[aria-expanded="true"] svg{transform:rotate(180deg)}
.xp-detail{margin-top:10px;padding-top:14px;border-top:1px dashed var(--line);animation:drawer .32s cubic-bezier(.2,.8,.2,1)}
@keyframes drawer{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tld-scope{font-size:14.5px;color:var(--ink-soft);line-height:1.65;margin-bottom:12px}
.tld-stack{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tld-chip{
  font:700 11px/1 var(--font);padding:6px 9px;border-radius:7px;
  background:color-mix(in srgb,var(--blue) 10%,transparent);color:var(--blue);
  border:1px solid color-mix(in srgb,var(--blue) 22%,transparent);
}
.tld-out{display:grid;gap:8px}
.tld-out li{display:flex;gap:9px;font-size:14px;color:var(--ink-soft);line-height:1.55;align-items:flex-start}
.tld-out svg{width:15px;height:15px;color:var(--teal);flex:none;margin-top:3px}
.ind{display:grid;gap:16px}
.ind-row .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px}
.ind-row .nm{font-size:14px;font-weight:500;color:var(--ink-soft)}
.ind-row .pc{font-size:14px;font-weight:700;color:var(--head)}
.imp{display:grid;gap:16px}
.imp-row{display:flex;align-items:center;gap:14px}
.imp-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.imp-ic svg{width:23px;height:23px}
.imp .v{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.02em}
.imp .l{font-size:13px;color:var(--ink-mute);line-height:1.4;margin-top:3px}

/* ---------- Education ---------- */
.edu-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.edu{display:flex;gap:18px;align-items:center}
.edu-ic{
  width:66px;height:66px;border-radius:18px;display:grid;place-items:center;color:#fff;flex:none;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 14px 26px -14px var(--c1);
}
.edu-ic svg{width:31px;height:31px}
.edu h4{font-size:20px;color:var(--head);font-weight:700;line-height:1.25}
.edu .sch{color:var(--ink-soft);font-size:15px;margin-top:3px}
.yrs{display:inline-block;margin-top:9px;font-size:12.5px;font-weight:600;color:var(--blue);background:var(--sky);padding:4px 11px;border-radius:999px}
.sub-h{font-size:clamp(26px,3vw,34px);font-weight:600;color:var(--head);text-align:center;margin:56px 0 26px}
.cert-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.cert{
  background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;text-align:center;
}
.cert:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.cert-top{
  height:92px;display:grid;place-items:center;position:relative;
  background:
    radial-gradient(circle at 85% 20%,rgba(255,255,255,.22) 0 22px,transparent 23px),
    radial-gradient(circle at 12% 90%,rgba(255,255,255,.14) 0 34px,transparent 35px),
    linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#0b1f4d));
}
.cert-badge{
  width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 12px 22px -12px rgba(0,0,0,.5);transform:translateY(32px);transition:transform .3s cubic-bezier(.2,.8,.3,1.4);
}
.cert:hover .cert-badge{transform:translateY(28px) rotate(-6deg)}
.cert-badge > svg{width:30px;height:30px}
.cert-badge .gen{background:var(--c)}
.cert-body{padding:44px 16px 22px}
.cert-code{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute)}
.cert b{display:block;font-size:16px;color:var(--head);margin-top:6px;line-height:1.3}
.cert-iss{display:block;font-size:13px;color:var(--ink-mute);margin-top:6px}

/* ---------- Projects ---------- */
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.proj{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px 22px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;
  transition:transform .25s,box-shadow .25s,border-color .25s;
}
.proj::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.proj:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.proj-ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 12px 22px -12px var(--c)}
.proj-ic svg{width:24px;height:24px}
.proj h4{font-size:20px;color:var(--head);line-height:1.25}
.proj p{font-size:15px;color:var(--ink-soft);line-height:1.65;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{
  font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;
  background:color-mix(in srgb,var(--c) 11%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--head));
}
.center{display:flex;justify-content:center;margin-top:34px}
.impact-row{margin-top:30px}
.impact-row .imp{grid-template-columns:repeat(3,1fr);gap:20px}

/* ---------- Contact ---------- */
.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.photo-wrap{position:relative;width:min(360px,76vw);aspect-ratio:1;margin:0 auto}
.photo-wrap .ring{position:absolute;inset:-6%;width:112%;height:112%;overflow:visible}
.photo{
  position:absolute;inset:8%;width:84%;height:84%;border-radius:50%;object-fit:cover;
  border:6px solid var(--card);box-shadow:var(--shadow-lg);background:var(--sky);
}
.photo-ph{display:grid;place-items:center;font-size:64px;font-weight:700;color:var(--blue)}
.badge{
  position:absolute;width:58px;height:58px;border-radius:18px;background:#fff;border:1px solid var(--line);
  box-shadow:var(--shadow);display:grid;place-items:center;
}
.badge svg{width:30px;height:30px}
.badge.b1{top:4%;right:0}
.badge.b2{bottom:16%;right:-6%}
.badge.b3{bottom:2%;left:6%}
.contact-txt .socials{margin-top:20px}
.contact-list{display:grid;gap:10px;margin-top:22px}
.contact-item{
  display:flex;align-items:center;gap:12px;padding:9px 10px 9px 10px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);transition:border-color .2s,transform .2s;
}
.contact-item:hover{border-color:color-mix(in srgb,var(--blue) 50%,var(--line));transform:translateX(3px)}
.contact-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sky);color:var(--blue);flex:none}
.contact-ic svg{width:17px;height:17px}
.contact-link{flex:1;text-decoration:none;color:var(--ink);font-size:15px;font-weight:500;word-break:break-word}
.contact-link:hover,.contact-link:focus-visible{color:var(--blue)}
.copy-btn{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;cursor:pointer;
  background:transparent;border:1px solid transparent;color:var(--ink-mute);opacity:0;transition:.16s;
}
.contact-item:hover .copy-btn,.copy-btn:focus-visible{opacity:1}
.copy-btn:hover{background:var(--sky);border-color:color-mix(in srgb,var(--blue) 30%,transparent);color:var(--blue)}
.copy-btn.done{opacity:1;color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,transparent)}
.copy-btn svg{width:15px;height:15px}
.quote-card{margin-top:60px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px 30px;padding:24px 26px}
.quote{display:flex;gap:12px;align-items:flex-start;font-size:16px;font-style:italic;color:var(--ink-soft);line-height:1.6;max-width:70ch}
.quote svg{width:24px;height:24px;color:var(--blue);flex:none;margin-top:-2px}
.quote-card .cta{grid-row:1;grid-column:2}
.traits{display:flex;gap:12px 26px;flex-wrap:wrap;grid-column:1/-1;padding-top:16px;border-top:1px solid var(--line)}
.trait{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink-soft)}
.trait svg{width:19px;height:19px;color:var(--blue)}
.cta{
  display:inline-flex;align-items:center;gap:11px;flex:none;text-decoration:none;
  padding:9px 14px 9px 10px;border-radius:999px;background:linear-gradient(135deg,#13306e,#0b1f4d);
  border:1px solid rgba(96,165,250,.35);color:#fff;box-shadow:0 10px 24px -14px rgba(8,20,48,.9);
  transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s,border-color .2s;
}
.cta:hover{transform:translateY(-2px);border-color:var(--blue-300)}
.cta-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--blue);color:#fff}
.cta-ic svg{width:17px;height:17px}
.cta-txt{display:grid;line-height:1.25}
.cta-txt b{font-size:13px;font-weight:700;color:#fff}
.cta-txt span{font-size:11px;color:#a9bbdf}
.cta-go{width:15px;height:15px;color:var(--blue-300);flex:none;transform:rotate(-90deg)}

/* ---------- Footer ---------- */
.foot{text-align:center;padding:24px 20px 42px;color:var(--ink-mute);font-size:15px}
.foot .heart{display:inline-block;width:16px;height:16px;color:#ef4444;vertical-align:-2px;margin:0 2px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.14)}}
.foot a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line)}
.foot a:hover{color:var(--blue);border-color:var(--blue)}
.foot .fine{font-size:13px;margin-top:6px}
.to-top{
  position:fixed;right:20px;bottom:22px;z-index:80;width:46px;height:46px;border-radius:50%;border:none;
  background:var(--btn);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s;
}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.to-top:hover{background:var(--blue)}
.to-top svg{width:20px;height:20px}

/* ---------- Illustrations ---------- */
.ill .i-blob{fill:var(--i-blob)} .ill .i-paper{fill:var(--i-paper)} .ill .i-panel{fill:var(--i-panel)}
.ill .i-card{fill:var(--i-paper);stroke:var(--i-line);stroke-width:1.5}
.ill .i-grid{fill:var(--i-grid)} .ill .i-desk{fill:var(--i-desk)} .ill .i-desk-2{fill:var(--i-desk-2)}
.ill .i-frame{fill:var(--i-frame)} .ill .i-navy{fill:var(--i-navy)} .ill .i-skin{fill:var(--i-skin)}
.ill .i-skin-2{fill:var(--i-skin-2)} .ill .i-hair{fill:var(--i-hair)} .ill .i-shirt{fill:var(--i-shirt)}
.ill .i-jacket{fill:var(--i-jacket)} .ill .i-shoe{fill:var(--i-shoe)} .ill .i-shadow{fill:var(--i-shadow)}
.ill .i-chair{fill:var(--i-chair)} .ill .i-chair-2{fill:var(--i-chair-2)} .ill .i-cloud{fill:var(--i-cloud)}
.ill .s{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ill .s-skin{stroke:var(--i-skin)} .ill .s-shirt{stroke:var(--i-shirt)} .ill .s-jacket{stroke:var(--i-jacket)}
.ill .s-pants{stroke:var(--i-pants)} .ill .s-pants-2{stroke:var(--i-pants-2)} .ill .s-chair{stroke:var(--i-chair)}
.ill .s-grid{stroke:var(--i-grid)} .ill .s-navy{stroke:var(--i-navy)} .ill .s-desk{stroke:var(--i-desk-2)}
.ill .s-frame{stroke:var(--i-frame)}
.ill .t-s{font:600 10px var(--font);fill:#7f8daa} .ill .t-b{font:700 15px var(--font);fill:#0b1f4d}
.ill .t-w{font:700 13px var(--font);fill:#fff}
.fl-a{animation:floaty 6s ease-in-out infinite}
.fl-b{animation:floaty 7s ease-in-out -2.5s infinite}
.fl-c{animation:floaty 5.5s ease-in-out -1s infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.78)}}
.flow{stroke-dasharray:5 10;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-30}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.steam{animation:steam 2.8s ease-in-out infinite;opacity:.7}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-5px);opacity:.75}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.chug{animation:chug 1.4s ease-in-out infinite}
@keyframes chug{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.flag{transform-box:fill-box;transform-origin:0% 50%;animation:flag 1.6s ease-in-out infinite}
@keyframes flag{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(6deg) scaleX(.9)}}

/* ---------- Modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(3,8,20,.55);backdrop-filter:blur(5px);display:none;place-items:center;z-index:200;padding:22px}
.overlay.open{display:grid}
.modal{width:min(640px,100%);max-height:86vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:24px}
.modal h3{font-size:19px;font-weight:700;margin-bottom:6px;color:var(--head)}
.modal .sub{font-size:14px;color:var(--ink-mute);margin-bottom:16px;line-height:1.6}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.help-list{display:grid;gap:11px;font-size:14.5px;color:var(--ink-soft)}
.help-list b{color:var(--head)}
.kbd{display:inline-block;padding:1px 7px;border-radius:6px;border:1px solid var(--line);background:var(--card-2);font:600 12px/1.5 ui-monospace,Menlo,monospace;color:var(--head)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:300;max-width:calc(100% - 32px);
  background:var(--head);color:var(--page);font:600 13.5px/1.3 var(--font);padding:12px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Reveal ---------- */
.reveal{opacity:0;transform:translateY(18px)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .cert-grid{grid-template-columns:repeat(2,1fr)}
  .exp-strip{grid-template-columns:repeat(3,1fr)}
  .menu a{padding:8px 10px}
}
@media (max-width:920px){
  .burger{display:grid}
  .menu{
    position:absolute;top:calc(100% + 6px);left:12px;right:12px;display:none;flex-direction:column;gap:2px;
    padding:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);
  }
  body.menu-open .menu{display:flex}
  .menu a{padding:12px 14px;border-radius:12px;font-size:16px}
  .hero,.wid,.sec-intro,.contact,.xp-grid,.grid-2{grid-template-columns:1fr}
  .hero{min-height:0;gap:18px}
  .hero-art{max-width:540px;margin:0 auto;width:100%}
  .wid{gap:18px;padding:26px 0}
  .wid.flip .wid-art{order:0}
  .wid-art,.sec-intro-art{max-width:480px;margin:0 auto;width:100%}
  .xp-side{position:static}
  .proj-grid{grid-template-columns:1fr 1fr}
  .impact-row .imp{grid-template-columns:1fr}
  .sec{padding:64px 18px}
  .contact{gap:34px}
}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats > :last-child{grid-column:1/-1}
  .exp-strip{grid-template-columns:repeat(2,1fr)}
  .exp-strip > :last-child{grid-column:1/-1}
  .edu-grid,.cert-grid,.proj-grid{grid-template-columns:1fr}
  .nav-in{padding:10px 16px;gap:10px}
  .logo{font-size:18px;gap:9px}
  .logo-mark{width:34px;height:34px;border-radius:11px}
  #btnPrint,#btnHelp{display:none}
  .sec{padding:54px 16px}
  #home{padding-top:22px}
  .lensbar{border-radius:18px}
  .btn{padding:12px 16px;font-size:14px}
  .tech-strip{gap:8px}
  .tech{width:62px}
  .tech-ic{width:50px;height:50px;border-radius:14px}
  .tech-ic > svg{width:26px;height:26px}
  .tech-l{font-size:11px}
  .quote-card{grid-template-columns:1fr}
  .quote-card .cta{grid-row:auto;grid-column:auto;justify-self:start}
  .xp{grid-template-columns:44px minmax(0,1fr);gap:12px}
  .xp-logo{width:44px;height:44px;font-size:14px}
  .xp-list::before{left:21px}
  .edu{flex-direction:column;align-items:flex-start}
  .quote-card{padding:20px}
  .badge{width:50px;height:50px;border-radius:15px}
  .badge svg{width:26px;height:26px}
  .badge.b2{right:-2%}
}
@media (hover:none){ .copy-btn{opacity:.85} }
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}

/* ---------- Print ---------- */
@media print{
  :root,html[data-theme="dark"]{
    --page:#ffffff; --card:#ffffff; --card-2:#f5f7fb; --sky:#eaf1fe;
    --head:#0b1f4d; --ink:#1e293b; --ink-soft:#475569; --ink-mute:#64748b;
    --line:#e2e8f0; --track:#e9eef6; --btn:#0b1f4d;
    --i-blob:#eef4fe; --i-paper:#ffffff; --i-line:#e3e8f1; --i-panel:#f3f6fb; --i-grid:#e2e8f1;
    --i-desk:#e3e8f0; --i-desk-2:#cbd3df; --i-frame:#0b1f4d; --i-navy:#0b1f4d;
    --i-pants:#0b1f4d; --i-pants-2:#1a2f63; --i-jacket:#13306e; --i-chair:#334e86; --i-chair-2:#24396a;
    --i-shadow:rgba(11,31,77,.08); --i-cloud:#dbe8fd;
  }
  @page{margin:12mm}
  body{background:#fff;font-size:13px}
  .nav,#bg,.lensbar,.to-top,.xp-more,.copy-btn,.hero-btns,.overlay,.toast,.cta{display:none!important}
  .sec{padding:18px 0;max-width:none}
  .hero{min-height:0}
  .reveal{opacity:1!important;transform:none!important}
  .card,.xp,.proj,.cert,.wid,.edu,.contact-item,.stat{break-inside:avoid;box-shadow:none!important}
  .card:hover,.proj:hover,.cert:hover{transform:none}
  [data-lens]{opacity:1!important;filter:none!important}
  .ill *{animation:none!important}
  .xp-side{position:static}
  /* paper is narrower than the desktop breakpoint, so keep the two column layout */
  .hero,.wid,.sec-intro,.contact,.grid-2,.edu-grid{grid-template-columns:1fr 1fr!important;gap:24px!important}
  .xp-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)!important}
  .wid.flip .wid-art{order:2!important}
  .stats,.exp-strip{grid-template-columns:repeat(5,1fr)!important;gap:10px!important}
  .stats > :last-child,.exp-strip > :last-child{grid-column:auto!important}
  .cert-grid{grid-template-columns:repeat(4,1fr)!important;gap:12px!important}
  .proj-grid{grid-template-columns:repeat(3,1fr)!important;gap:12px!important}
  .stat .ic{display:none}
  .stat .v{font-size:22px}
  .hero h1{font-size:38px}
  .lead{font-size:15px}
  .h2,.sec-head h2{font-size:28px}
  .sec-head{margin-bottom:18px}
  .wid{padding:10px 0;gap:20px!important}
  .wid h3{font-size:22px}
  .tech-strip{gap:6px;margin:10px 0 12px}
  .tech{width:58px}
  .tech-ic{width:40px;height:40px;border-radius:11px}
  .tech-ic > svg{width:22px;height:22px}
  .gen{width:26px;height:26px;border-radius:8px}
  .gen svg{width:15px;height:15px}
  .tech-l{font-size:9.5px}
  .bolts{gap:5px}
  .bolts li{font-size:12.5px;line-height:1.45}
  .bolts .bolt{width:14px;height:14px;margin-top:2px}
  .hero-art,.wid-art,.sec-intro-art{max-width:none!important}
  .sub-h{margin:24px 0 14px;font-size:22px}
  .quote-card{margin-top:20px}
  .sec-head,.sub-h,.h2,.wid h3{break-after:avoid;page-break-after:avoid}
  .lead-s{font-size:14px}
  .photo-wrap{width:240px}
  .contact-list{gap:6px}
  .contact-item{padding:6px 8px}
}
</style>

      <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18v-5"/><path d="M12 18V8"/><path d="M18 18v-8"/><path d="m5 9 5-4 4 3 5-4"/></svg></span>
      <span>Portfolio<span class="logo-dot">.</span></span>
    </a>

let logoSeq = 0;
function logo(k, cls){
  const L = LOGO[k];
  if(!L) return '';
  const u = 'lg'+(++logoSeq)+'-';          /* keep gradient ids unique per copy */
  const body = L.b
    .replace(/id="([^"]+)"/g, (m,id)=>'id="'+u+id+'"')
    .replace(/url\(#([^)]+)\)/g, (m,id)=>'url(#'+u+id+')')
    .replace(/href="#([^"]+)"/g, (m,id)=>'href="#'+u+id+'"');
  return '<svg viewBox="'+L.vb+'"'+(cls?' class="'+cls+'"':'')+' aria-hidden="true">'+body+'</svg>';
}

const KEY = 'cv-dashboard-v1';
const esc = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const lensAttr = item => (item && item.lens && item.lens.length) ? ' data-lens="'+item.lens.join(' ')+'"' : '';
const ext = href => /^https?:/i.test(href) ? ' target="_blank" rel="noopener noreferrer"' : '';
const initials = s => {
  const w = String(s).split(/\s+/).filter(Boolean);
  return (w.length > 1 ? w[0][0]+w[1][0] : w[0].slice(0,2)).toUpperCase();
};

function renderTech(){
  const rows = DATA.techstack.map(t=>

      '<div class="bar"><div class="bar-fill" data-w="'+t.level+'"></div><span class="bar-val">'+t.level+'%</span></div>'+
    '</div>').join('');
  return '<div class="card reveal"><div class="card-h">Tech Stack</div><div class="bars">'+rows+'</div></div>';
}

function renderSkills(){
  const total = DATA.skills.reduce((a,s)=>a+(+s.value||0),0) || 1;
  const R = 52, C = 2*Math.PI*R;
  let off = 0;
  const segs = DATA.skills.map((s,i)=>{
    const frac = (+s.value||0)/total, len = frac*C;
    const el = '<circle data-seg="'+i+'"'+lensAttr(s)+' tabindex="0" role="button" aria-label="'+esc(s.label)+', '+
      Math.round(frac*100)+' percent" cx="60" cy="60" r="'+R+'" fill="none" stroke="'+esc(s.color)+'" '+
      'stroke-width="21" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" '+
      'stroke-dashoffset="'+(-off).toFixed(2)+'" data-mid="'+(off+len/2).toFixed(2)+'"></circle>';
    off += len; return el;
  }).join('');
  const labs = DATA.skills.map((s,i)=>
    '<div class="dlab" data-lab="'+i+'"'+lensAttr(s)+' tabindex="0"><b>'+Math.round((+s.value||0)/total*100)+'%</b>'+esc(s.label)+'</div>').join('');
  return '<div class="card reveal"><div class="card-h">Skills Snapshot</div>'+
    '<div class="donut-wrap" id="donutWrap">'+
      '<svg class="donut" viewBox="0 0 120 120">'+segs+'</svg>'+
      '<div class="donut-mid" id="donutMid"><div class="ic">'+svg('bulb')+'</div></div>'+
      labs+
    '</div></div>';
}

/* ============================================================
   6. Donut interaction + label placement
   ============================================================ */
function fillBars(root){
  (root||document).querySelectorAll('.bar-fill[data-w]').forEach(f=>{ f.style.width = f.getAttribute('data-w')+'%'; });
}
function placeDonutLabels(){
  const wrap = document.getElementById('donutWrap');
  if(!wrap) return;
  const C = 2*Math.PI*52;
  wrap.querySelectorAll('.dlab').forEach(lab=>{
    const seg = wrap.querySelector('[data-seg="'+lab.getAttribute('data-lab')+'"]');
    if(!seg) return;
    const a = (+seg.getAttribute('data-mid') / C) * 2*Math.PI - Math.PI/2;
    lab.style.left = (50 + Math.cos(a)*38.5)+'%';
    lab.style.top  = (50 + Math.sin(a)*38.5)+'%';
    lab.style.textAlign = Math.cos(a) > .25 ? 'left' : (Math.cos(a) < -.25 ? 'right' : 'center');
  });
}
function wireDonut(){
  const wrap = document.getElementById('donutWrap');
  if(!wrap) return;
  const mid   = document.getElementById('donutMid');
  const total = DATA.skills.reduce((a,s)=>a+(+s.value||0),0) || 1;
  const base  = mid.innerHTML;
  const segs  = [...wrap.querySelectorAll('[data-seg]')];
  const labs  = [...wrap.querySelectorAll('[data-lab]')];
  let pinned = null;
  function paint(i){
    if(i === null){
      segs.forEach(o=>{ o.classList.remove('dim'); o.setAttribute('stroke-width','21'); });
      labs.forEach(l=>l.classList.remove('dim','on'));
      mid.innerHTML = base;
      return;
    }
    const s = DATA.skills[i];
    segs.forEach((o,n)=>{ o.classList.toggle('dim', n!==i); o.setAttribute('stroke-width', n===i ? '26' : '21'); });
    labs.forEach((l,n)=>{ l.classList.toggle('dim', n!==i); l.classList.toggle('on', n===i); });
    mid.innerHTML = '<div class="pv" style="color:'+esc(s.color)+'">'+Math.round(s.value/total*100)+'%</div>'+
                    '<div class="pl">'+esc(s.label)+'</div>';
  }
  segs.concat(labs).forEach((el,n)=>{
    const i = n % segs.length;
    el.addEventListener('mouseenter', ()=>paint(i));
    el.addEventListener('mouseleave', ()=>paint(pinned));
    el.addEventListener('focus', ()=>paint(i));
    el.addEventListener('blur', ()=>paint(pinned));
    el.addEventListener('click', ()=>{ pinned = (pinned === i) ? null : i; paint(pinned); });
    el.addEventListener('keydown', ev=>{
      if(ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      pinned = (pinned === i) ? null : i; paint(pinned);
    });
  });
}

/* -- focus lenses: dim everything that is not tagged with the chosen theme -- */
let lens = null;
function applyLens(quiet){
  document.body.classList.toggle('lens-on', lens !== null);
  document.querySelectorAll('.lens').forEach(c=>
    c.setAttribute('aria-pressed', c.getAttribute('data-pick') === lens ? 'true' : 'false'));
  document.querySelectorAll('[data-lens]').forEach(el=>{
    const hit = lens === null || el.getAttribute('data-lens').split(' ').includes(lens);
    el.classList.toggle('lens-hit', hit && lens !== null);
    el.classList.toggle('lens-miss', !hit);
  });
  if(lens !== null && !quiet){
    const l = DATA.lenses.find(x=>x.id===lens);
    const n = document.querySelectorAll('[data-lens].lens-hit').length;
    if(l) toast(l.label + ': ' + n + ' matching ' + (n===1?'item':'items') + ' highlighted across the page');
  }
}
function pickLens(id){ lens = (lens === id || !id) ? null : id; applyLens(); }

/* ============================================================
   8. Reveal + count-up
   ============================================================ */
let io = null;
function countUp(el){
  const raw = el.textContent.trim();
  const m = raw.match(/^(\D*)(\d[\d,.]*)(.*)$/);
  if(!m) return;
  const target = parseFloat(m[2].replace(/,/g,''));
  if(!isFinite(target) || target === 0) return;
  const dur = 900, t0 = performance.now();
  const step = now=>{
    const k = Math.max(0, Math.min(1, (now-t0)/dur));   /* a frame can be stamped before t0 */
    const e = 1 - Math.pow(1-k, 3);
    el.textContent = m[1] + Math.round(target*e).toLocaleString() + m[3];
    if(k < 1) requestAnimationFrame(step); else el.textContent = raw;
  };
  requestAnimationFrame(step);
}
function revealNow(el){
  if(el.classList.contains('in')) return;
  el.classList.add('in');
  fillBars(el);
  el.querySelectorAll('[data-count]').forEach(countUp);
}
function observeReveal(){
  if(io) io.disconnect();
  const items = document.querySelectorAll('.reveal');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)){
    items.forEach(el=>{ el.classList.add('in'); fillBars(el); });
    return;
  }
  io = new IntersectionObserver(entries=>{
    entries.forEach((en,n)=>{
      if(!en.isIntersecting) return;
      io.unobserve(en.target);
      setTimeout(()=>revealNow(en.target), n*70);
    });
  }, {threshold:.12, rootMargin:'0px 0px -40px 0px'});
  items.forEach(el=>io.observe(el));
}
window.addEventListener('resize', ()=>placeDonutLabels());

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 3200);
}
const overlay = document.getElementById('overlay');
const modal   = document.getElementById('modal');
function openModal(html){ modal.innerHTML = html; overlay.classList.add('open'); const b = modal.querySelector('[data-close]'); if(b) b.focus(); }
function closeModal(){ overlay.classList.remove('open'); modal.innerHTML=''; }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('click', e=>{ if(e.target.closest('[data-close]')) closeModal(); });

function copyText(str, after){
  const done = after || (()=>toast('Copied to clipboard'));
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(done).catch(()=>legacyCopy(str,done));
  } else legacyCopy(str, done);
}
function legacyCopy(str, done){
  const ta = document.createElement('textarea');
  ta.value = str; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }
  catch(e){ toast('Select the text and copy it manually'); }
  document.body.removeChild(ta);
}

/* ============================================================
   10. Constellation background
   ============================================================ */
(function constellation(){
  const c = document.getElementById('bg');
  if(!c || !c.getContext) return;
  const ctx = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LINK = 150, PULL = 165;
  let w = 0, h = 0, nodes = [], raf = null;
  const pointer = { x:-9999, y:-9999, on:false };
  function size(){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    w = c.clientWidth; h = c.clientHeight;
    c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const want = Math.max(28, Math.min(90, Math.round((w*h)/20000)));
    nodes = Array.from({length:want}, ()=>({
      x: Math.random()*w, y: Math.random()*h,
      vx:(Math.random()-.5)*.2, vy:(Math.random()-.5)*.2,
      r: Math.random()*1.5 + .8
    }));
  }
  function ink(){
    return document.documentElement.getAttribute('data-theme') === 'dark'
      ? { dot:'rgba(147,197,253,', line:'rgba(96,165,250,', dotA:.6, lineA:.22 }
      : { dot:'rgba(37,99,235,',  line:'rgba(37,99,235,',  dotA:.26, lineA:.09 };
  }
  function draw(){
    const k = ink();
    ctx.clearRect(0, 0, w, h);
    for(const p of nodes){
      if(!reduce){
        p.x += p.vx; p.y += p.vy;
        if(p.x < 0 || p.x > w) p.vx *= -1;
        if(p.y < 0 || p.y > h) p.vy *= -1;
        if(pointer.on){
          const dx = p.x - pointer.x, dy = p.y - pointer.y, d = Math.hypot(dx, dy);
          if(d > 0.5 && d < PULL){ const f = (1 - d/PULL) * 0.7; p.x += (dx/d)*f; p.y += (dy/d)*f; }
        }
      }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = k.dot + k.dotA + ')'; ctx.fill();
    }
    ctx.lineWidth = 1;
    for(let i=0; i<nodes.length; i++){
      const a = nodes[i];
      for(let j=i+1; j<nodes.length; j++){
        const b = nodes[j], d = Math.hypot(a.x-b.x, a.y-b.y);
        if(d >= LINK) continue;
        ctx.strokeStyle = k.line + (k.lineA * (1 - d/LINK)).toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      if(pointer.on){
        const d = Math.hypot(a.x-pointer.x, a.y-pointer.y);
        if(d < PULL){
          ctx.strokeStyle = k.line + (k.lineA*1.5*(1 - d/PULL)).toFixed(3) + ')';
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
        }
      }
    }
  }
  function loop(){ draw(); raf = requestAnimationFrame(loop); }
  function start(){ if(reduce){ draw(); return; } if(!raf) loop(); }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf = null; } }
  window.addEventListener('resize', ()=>{ size(); if(reduce) draw(); });
  window.addEventListener('pointermove', e=>{ pointer.x = e.clientX; pointer.y = e.clientY; pointer.on = true; });
  window.addEventListener('pointerleave', ()=>{ pointer.on = false; });
  document.addEventListener('visibilitychange', ()=> document.hidden ? stop() : start());
  window.addEventListener('beforeprint', stop);
  window.addEventListener('afterprint', start);
  size(); start();
  window.repaintBackdrop = draw;
})();

})();
